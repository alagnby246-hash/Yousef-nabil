<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YoussefFlix | أفلام ومسلسلات</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #141414;
      color: white;
    }

    header {
      background: #111;
      padding: 18px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #e50914;
    }

    .logo span {
      color: white;
    }

    .search-box {
      display: flex;
      width: 420px;
      max-width: 100%;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 0 6px 6px 0;
    }

    .search-box button {
      background: #e50914;
      color: white;
      font-weight: bold;
      border: none;
      padding: 0 20px;
      cursor: pointer;
      border-radius: 6px 0 0 6px;
    }

    .search-box button:hover {
      background: #ff2630;
    }

    .hero {
      min-height: 390px;
      display: flex;
      align-items: center;
      padding: 45px 8%;
      background:
        linear-gradient(90deg, #141414 5%, rgba(20, 20, 20, 0.78) 50%, rgba(20, 20, 20, 0.15)),
        url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
    }

    .hero-content {
      max-width: 600px;
    }

    .hero h1 {
      font-size: 48px;
      margin: 0 0 15px;
    }

    .hero p {
      color: #ddd;
      font-size: 18px;
      line-height: 1.8;
    }

    .hero button {
      background: white;
      color: #111;
      padding: 13px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      padding: 35px 7%;
      min-height: 450px;
    }

    h2 {
      font-size: 26px;
    }

    #message {
      color: #ccc;
      margin-bottom: 22px;
      font-size: 16px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }

    .card {
      background: #222;
      border-radius: 8px;
      overflow: hidden;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.04);
      background: #303030;
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .info {
      padding: 13px;
    }

    .info h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .info p {
      color: #bbb;
      margin: 6px 0;
      font-size: 14px;
    }

    .button {
      display: block;
      text-align: center;
      margin-top: 13px;
      padding: 10px;
      background: #e50914;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    .button:hover {
      background: #ff2630;
    }

    footer {
      margin-top: 35px;
      padding: 28px;
      text-align: center;
      background: #111;
      color: #999;
      font-size: 14px;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        padding: 15px;
      }

      .search-box {
        width: 100%;
      }

      .hero {
        min-height: 340px;
      }

      .hero h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Youssef<span>Flix</span></div>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="اكتب اسم فيلم أو مسلسل..."
      >

      <button onclick="searchMovie()">بحث</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>أهلاً بك في YoussefFlix</h1>

      <p>
        اكتب اسم أي فيلم أو مسلسل عربي أو أجنبي،
        وسنبحث عنه داخل قاعدة بيانات الأفلام والمسلسلات.
      </p>

      <button onclick="goToSearch()">ابحث الآن</button>
    </div>
  </section>

  <main id="searchSection">
    <h2>نتائج البحث</h2>

    <p id="message">
      اكتب اسم فيلم أو مسلسل في مربع البحث بالأعلى.
    </p>

    <div class="movies" id="movies"></div>
  </main>

  <footer>
    <div>© 2026 YoussefFlix — تصميم يوسف نبيل</div>
    <div>This product uses the TMDB API but is not endorsed or certified by TMDB.</div>
  </footer>

  <script>
    /* ================================
       ضع مفتاح TMDB الخاص بك هنا فقط
       ================================ */

    const API_KEY = "abeaffa377ecf0768b0262ca8208fd63";

    const moviesBox = document.getElementById("movies");
    const message = document.getElementById("message");
    const searchInput = document.getElementById("searchInput");

    function goToSearch() {
      searchInput.focus();

      document.getElementById("searchSection").scrollIntoView({
        behavior: "smooth"
      });
    }

    async function searchMovie() {
      const movieName = searchInput.value.trim();

      if (movieName === "") {
        message.innerText = "اكتب اسم فيلم أو مسلسل الأول.";
        moviesBox.innerHTML = "";
        return;
      }

      if (API_KEY === "ضع_مفتاح_TMDB_هنا") {
        message.innerText = "ضع TMDB API Key في الكود الأول ثم جرّب مرة ثانية.";
        moviesBox.innerHTML = "";
        return;
      }

      message.innerText = "جاري البحث عن: " + movieName;
      moviesBox.innerHTML = "";

      const url =
        "https://api.themoviedb.org/3/search/multi?api_key=" +
        API_KEY +
        "&language=ar-EG&query=" +
        encodeURIComponent(movieName);

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("API Error");
        }

        const data = await response.json();

        const results = data.results.filter(item =>
          item.media_type === "movie" || item.media_type === "tv"
        );

        if (results.length === 0) {
          message.innerText = "ملقيناش نتائج بالاسم ده.";
          return;
        }

        message.innerText = "نتائج البحث عن: " + movieName;

        results.forEach(item => {
          const title = item.title || item.name || "بدون اسم";

          const date =
            item.release_date ||
            item.first_air_date ||
            "";

          const year = date ? date.substring(0, 4) : "غير معروف";

          const type =
            item.media_type === "movie"
              ? "فيلم"
              : "مسلسل";

          const image = item.poster_path
            ? "https://image.tmdb.org/t/p/w500" + item.poster_path
            : "https://via.placeholder.com/500x750?text=No+Image";

          const officialSearchLink =
            "https://www.google.com/search?q=" +
            encodeURIComponent(title + " مشاهدة رسمية");

          moviesBox.innerHTML += `
            <div class="card">
              <img src="${image}" alt="${title}">

              <div class="info">
                <h3>${title}</h3>

                <p>${type}</p>

                <p>سنة الإنتاج: ${year}</p>

                <a
                  class="button"
                  href="${officialSearchLink}"
                  target="_blank"
                >
                  ابحث عن المشاهدة الرسمية
                </a>
              </div>
            </div>
          `;
        });

      } catch (error) {
        message.innerText =
          "حصلت مشكلة. تأكد أن API Key صحيح ثم جرّب مرة ثانية.";

        console.log(error);
      }
    }

    searchInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchMovie();
      }
    });
  </script>

</body>
</html>
