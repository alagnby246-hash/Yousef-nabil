<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YoussefFlix</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #141414;
      color: white;
    }

    header {
      background: #111;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      color: #e50914;
      font-size: 30px;
      font-weight: bold;
    }

    .logo span {
      color: white;
    }

    #search {
      padding: 12px 15px;
      width: 320px;
      max-width: 100%;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
    }

    .hero {
      min-height: 380px;
      display: flex;
      align-items: center;
      padding: 50px 8%;
      background:
        linear-gradient(90deg, #141414, rgba(20,20,20,.55)),
        url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
    }

    .hero h1 {
      font-size: 48px;
      margin: 0 0 10px;
    }

    .hero p {
      font-size: 18px;
      color: #ddd;
      max-width: 600px;
      line-height: 1.8;
    }

    main {
      padding: 35px 7%;
    }

    #message {
      color: #aaa;
      margin-bottom: 25px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }

    .card {
      background: #222;
      border-radius: 8px;
      overflow: hidden;
      transition: .2s;
    }

    .card:hover {
      transform: scale(1.04);
      background: #333;
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .info {
      padding: 12px;
    }

    .info h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .info p {
      color: #bbb;
      margin: 6px 0;
      font-size: 14px;
    }

    .button {
      display: block;
      margin-top: 12px;
      padding: 10px;
      text-align: center;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      background: #111;
      color: #777;
      padding: 25px;
      margin-top: 35px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
      }

      #search {
        width: 100%;
      }

      .hero h1 {
        font-size: 34px;
      }

      .movies {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .card img {
        height: 230px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    Youssef<span>Flix</span>
  </div>

  <input
    id="search"
    type="text"
    placeholder="ابحث عن فيلم أو مسلسل..."
    autocomplete="off"
  >

</header>

<section class="hero">

  <div>

    <h1>أهلاً بك في YoussefFlix</h1>

    <p>
      ابحث عن أي فيلم أو مسلسل وشاهد معلوماته
      وسنة الإنتاج والتقييم والصورة.
    </p>

  </div>

</section>

<main>

  <h2>الأفلام والمسلسلات</h2>

  <p id="message">
    جاري تحميل المحتوى...
  </p>

  <div class="movies" id="movies"></div>

</main>

<footer>
  © 2026 YoussefFlix — تصميم يوسف نبيل
</footer>
