<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoussefFlix</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #141414;
      color: white;
    }

    header {
      background: #111;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #e50914;
      font-size: 30px;
      font-weight: bold;
    }

    .logo span {
      color: white;
    }

    input {
      padding: 10px;
      width: 250px;
      border: none;
      border-radius: 5px;
      font-size: 15px;
    }

    .hero {
      min-height: 380px;
      display: flex;
      align-items: center;
      padding: 50px 8%;
      background:
        linear-gradient(90deg, #141414, rgba(20,20,20,0.65)),
        url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #ddd;
      max-width: 550px;
      line-height: 1.8;
    }

    main {
      padding: 35px 7%;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }

    .card {
      background: #222;
      border-radius: 8px;
      overflow: hidden;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
      background: #333;
    }

    .card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
    }

    .info {
      padding: 12px;
    }

    .info h3 {
      margin: 0 0 10px;
    }

    .info p {
      color: #bbb;
      margin: 5px 0;
    }

    .button {
      display: block;
      margin-top: 12px;
      padding: 10px;
      text-align: center;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      background: #111;
      color: #999;
      padding: 25px;
      margin-top: 35px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      input {
        width: 100%;
      }

      .hero h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Youssef<span>Flix</span></div>

    <input
      id="search"
      type="text"
      placeholder="اكتب اسم فيلم أو مسلسل"
      onkeyup="searchMovie()"
    >
  </header>

  <section class="hero">
    <div>
      <h1>أهلاً بك في YoussefFlix</h1>
      <p>
        موقع يوسف للأفلام والمسلسلات.
        ابحث عن فيلمك أو مسلسلك المفضل واعرف أين تشاهده بشكل رسمي.
      </p>
    </div>
  </section>

  <main>
    <h2>أفلام ومسلسلات</h2>
    <p id="message">اختر فيلمًا أو مسلسلًا.</p>

    <div class="movies" id="movies"></div>
  </main>

  <footer>
    © 2026 YoussefFlix — تصميم يوسف نبيل
  </footer>

    function showMovies(list) {
      const box = document.getElementById("movies");
      const message = document.getElementById("message");

      box.innerHTML = "";

      if (list.length === 0) {
        message.innerText = "ملقيناش الفيلم أو المسلسل ده.";
        return;
      }

      message.innerText = "عدد النتائج: " + list.length;

      list.forEach(movie => {
        box.innerHTML += `
          <div class="card">
            <img src="${movie.image}" alt="${movie.name}">

            <div class="info">
              <h3>${movie.name}</h3>
              <p>${movie.type}</p>
              <p>سنة الإنتاج: ${movie.year}</p>

              <a class="button" href="${movie.link}" target="_blank">
                ابحث عن المشاهدة الرسمية
              </a>
            </div>
          </div>
        `;
      });
    }
